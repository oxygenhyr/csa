<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册报名 - 计算机协会</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">&lt;<span>/</span>&gt; 计算机协会</a>
  <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
  <ul class="nav-links">
    <li><a href="index.html">首页</a></li>
    <li><a href="members.html">成员名单</a></li>
    <li><a href="register.html" class="active">注册报名</a></li>
<!-- 管理后台入口已隐藏 -->
  </ul>
</nav>

<main class="container">
  <div class="page-header">
    <h1>📝 注册报名</h1>
    <p>填写信息，加入计算机协会</p>
  </div>

  <div class="card" style="max-width:650px;margin:0 auto;">
    <!-- 提示 -->
    <div class="alert alert-success" id="alertSuccess">✅ 报名成功！请等待管理员审核。</div>
    <div class="alert alert-error" id="alertError"></div>

    <form id="registerForm" onsubmit="handleSubmit(event)">
      <div class="form-row">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="name" placeholder="请输入真实姓名" required maxlength="20">
        </div>
        <div class="form-group">
          <label>学号 *</label>
          <input type="text" id="studentId" placeholder="请输入学号" required maxlength="20">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>院系/专业 *</label>
          <input type="text" id="department" placeholder="例如：计算机科学与技术学院" required maxlength="50">
        </div>
        <div class="form-group">
          <label>年级 *</label>
          <select id="grade" required>
            <option value="">请选择年级</option>
            <option value="大一">大一</option>
            <option value="大二">大二</option>
            <option value="大三">大三</option>
            <option value="大四">大四</option>
            <option value="研一">研一</option>
            <option value="研二">研二</option>
            <option value="研三">研三</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" placeholder="your@example.com">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11">
        </div>
      </div>

      <div class="form-group">
        <label>技能/兴趣方向</label>
        <input type="text" id="skills" placeholder="例如：Python、前端、AI、网络安全..." maxlength="100">
        <div class="form-hint">填多个技能用逗号或空格分隔</div>
      </div>

      <div class="form-group">
        <label>申请职位（选填）</label>
        <select id="position">
          <option value="">暂无</option>
          <option value="干事">干事</option>
          <option value="技术部">技术部</option>
          <option value="宣传部">宣传部</option>
          <option value="组织部">组织部</option>
          <option value="外联部">外联部</option>
          <option value="其他">其他</option>
        </select>
        <div class="form-hint">选择你感兴趣的部门或职位，管理员审核时可调整</div>
      </div>

      <div class="form-group">
        <label>加入理由</label>
        <textarea id="reason" placeholder="简单说说你为什么想加入计算机协会？（选填）" maxlength="500"></textarea>
        <div class="form-hint"><span id="charCount">0</span>/500</div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">
        🚀 提交报名
      </button>
    </form>
  </div>
</main>

<footer class="footer">
  © 2026 计算机协会 · Computer Science Association
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script>
  // 字数统计
  document.getElementById('reason').addEventListener('input', function() {
    document.getElementById('charCount').textContent = this.value.length;
  });

  // 表单提交
  async function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertSuccess = document.getElementById('alertSuccess');
    const alertError = document.getElementById('alertError');

    alertSuccess.style.display = 'none';
    alertError.style.display = 'none';

    // 收集数据
    const data = {
      name: document.getElementById('name').value,
      studentId: document.getElementById('studentId').value,
      department: document.getElementById('department').value,
      grade: document.getElementById('grade').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      skills: document.getElementById('skills').value,
      position: document.getElementById('position').value,
      reason: document.getElementById('reason').value,
    };

    // 验证
    if (!data.name || !data.studentId || !data.department || !data.grade) {
      alertError.textContent = '⚠️ 请填写所有必填项（带 * 的字段）';
      alertError.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ 提交中...';

    try {
      await createMember(data);
      alertSuccess.style.display = 'block';
      alertError.style.display = 'none';
      document.getElementById('registerForm').reset();
      document.getElementById('charCount').textContent = '0';
      // 滚动到顶部看提示
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      alertError.textContent = '⚠️ 提交失败：' + err.message;
      alertError.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 提交报名';
    }
  }
</script>
</body>
</html>
